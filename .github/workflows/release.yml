name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p mcode-ui
      - shell: pwsh
        run: |
          mkdir -p bundle-out
          cp target/release/MCode_Desktop.exe bundle-out/
          cp assets/brand/icon.ico bundle-out/MCode_Desktop.ico
          cp -r assets bundle-out/assets
          Compress-Archive -Path bundle-out/* -DestinationPath MCode_Desktop-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MCode_Desktop-win64
          path: MCode_Desktop-win64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/build-macos.sh
      - run: |
          cd target/release/bundle
          ditto -c -k --sequesterRsrc --keepParent MCode_Desktop.app MCode_Desktop-macos-arm64.zip
          hdiutil create -volname "MCode Desktop" -srcfolder MCode_Desktop.app -ov -fs HFS+ -format UDZO MCode_Desktop-macos-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: MCode_Desktop-macos
          path: |
            target/release/bundle/MCode_Desktop-macos-arm64.zip
            target/release/bundle/MCode_Desktop-macos-arm64.dmg

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
