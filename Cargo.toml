[workspace]
resolver = "2"
members = ["crates/mcode-ui"]

[workspace.package]
version = "0.1.11-beta.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# 内核：独立仓库 mcode-core（本地联调用 ~/.cargo/config.toml 的 [patch] 指向 ../mcode-core）
mcode-core = { git = "https://github.com/materin-tech/mcode-core", tag = "v0.1.0-beta.9" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
similar = "2"          # diff 算法（edit_file 卡片渲染源）
globset = "0.4"        # glob 匹配（glob/grep include 工具）
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
walkdir = "2"
pulldown-cmark = "0.13"

# UI 依赖
gpui = "0.2"
unicode-segmentation = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
